name: linesentry-edge

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./local/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  nodered:
    image: nodered/node-red:latest
    ports:
      - "1880:1880"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      IOT_ENDPOINT: "${IOT_ENDPOINT}"
      IOT_CLIENT_ID: "${IOT_CLIENT_ID:-linesentry-edge}"
      ERROR_BOUND_SIGMA: "${ERROR_BOUND_SIGMA:-}"
      HEARTBEAT_MS: "${HEARTBEAT_MS:-}"
    volumes:
      - ./edge/${EDGE_FLOW:-linesentry-edge-flow-aws.json}:/data/flows.json:ro
      - ./local/certs:/certs:ro
    depends_on:
      - mosquitto
